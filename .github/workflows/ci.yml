# SpriteFlow CI - five parallel gates, all green required before merge to main.
# Design source: docs/architecture-m1.md section 7.
#
# Toolchain pins (do not float):
#   Node 24.12.0  - root package.json "engines" + pnpm engineStrict fail loudly on drift
#   pnpm  11.9.0  - read from root package.json "packageManager" by pnpm/action-setup
#
# Every third-party action is pinned to a reviewed commit SHA (never a mutable tag),
# reviewed 2026-09-17 by R7 via `git ls-remote` against each upstream repository:
#   actions/checkout       v4.2.2 -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   pnpm/action-setup      v4.1.0 -> a7487c7e89a18df4991f7f222e4898a00d66ddda
#   actions/setup-node     v4.4.0 -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/cache          v4.2.2 -> d4323d4df104b026a6aa633fdb11d772146be0bf
#   actions/upload-artifact v4.4.0 -> 50769540e7f4bd5e21e526ee35c689e35e0d6874
# Bumping any pin requires a new audit entry in docs/devops.md (architecture sections 7/8).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (biome + boundaries + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Biome check + package boundary check + docs contract code blocks
        run: pnpm lint

  typecheck:
    name: typecheck (tsc strict, all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: tsc --noEmit per workspace (strict, no DOM in core)
        run: pnpm typecheck

  unit:
    name: unit (pipeline + web component tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Get pnpm store directory
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node24-pnpm11-
      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run unit tests (cancellation/transfer tests must not skip)
        run: pnpm test:unit

  golden:
    name: golden (20-case regression + export)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Get pnpm store directory
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node24-pnpm11-
      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Golden regression (full enumeration, no test.skip)
        run: pnpm golden
      - name: Upload golden reports (JSON/JUnit/overlay, CI artifact only)
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: golden-reports-${{ github.sha }}
          path: tests/golden/reports/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build (tsc + vite + license + budget)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - name: Get pnpm store directory
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-node24-pnpm11-
      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build all workspaces, then license closure + static output checks
        run: pnpm build
      - name: Upload static output + license audit trail
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: web-dist-${{ github.sha }}
          path: |
            apps/web/dist/
          retention-days: 14
          if-no-files-found: ignore
